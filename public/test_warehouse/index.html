<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />

    <title>Warehouse Test</title>
    <link rel="stylesheet" href="/test_warehouse/test_warehouse.css" />
  </head>
  <body>
    <main>
      <aside class="controls">
        <button id="generateButton">生成战利品仓</button>
