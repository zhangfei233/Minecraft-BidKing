<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MC竞拍之王</title>
    <link rel="stylesheet" href="/game/game.css" />
  </head>
  <body>
    <main class="game-page">
      <section class="players" id="players"></section>

      <section class="notice-panel">
        <header>第 <span id="roundNumber">1</span> 轮</header>
        <div class="notice-list" id="noticeList"></div>
      </section>

      <section class="action-panel">
        <div class="timer" id="timer">60</div>
        <button type="button" id="useItemButton">使用道具</button>
        <div class="active-skill-slot" id="activeSkillSlot" hidden>
          <button type="button" id="activeSkillButton" title="主动技能">
            <span id="activeSkillCountdown"></span>
            <img id="activeSkillIcon" src="" alt="" />
          </button>
          <div class="active-skill-pager" id="activeSkillPager" hidden>
            <button type="button" data-page="prev" aria-label="上一个主动技能">◀</button>
            <span id="activeSkillPage">1/1</span>
            <button type="button" data-page="next" aria-label="下一个主动技能">▶</button>
          </div>
        </div>
        <button type="button" id="bidButton">出价</button>
      </section>

      <aside class="warehouse-panel">
        <div class="warehouse-head">
          <h1>战利品仓</h1>
          <div class="warehouse-meta">
            <span>当前金钱 <strong id="gameMoney">0</strong></span>
            <span>已知总价值 <strong id="knownLootValue">0</strong></span>
            <a href="/wiki" target="_blank" rel="noreferrer">藏品百科</a>
          </div>
        </div>
        <div class="warehouse-scroll">
          <canvas id="warehouseCanvas"></canvas>
          <div class="canvas-tooltip" id="canvasTooltip" hidden></div>
        </div>
        <div class="warehouse-foot">
          <span id="pointerCoord" hidden>当前指针 (0,0)</span>
        </div>
      </aside>

      <section class="settlement-panel" id="settlementPanel" hidden>
        <h2>对局结束</h2>
        <div id="settlementWinner"></div>
        <div class="settlement-value">
          <span>最终竞拍价格</span>
          <strong id="finalBidValue">0</strong>
        </div>
        <div class="settlement-value">
          <span>战利品价值</span>
          <strong id="revealedLootValue">0</strong>
        </div>
        <div class="settlement-value">
          <span>利润</span>
          <strong id="profitValue">0</strong>
        </div>
      </section>

      <section class="settlement-actions" id="settlementActions" hidden>
        <p id="dividendText"></p>
        <div id="winnerSellActions" hidden>
          <button id="sellAllLootButton" type="button">全部出售</button>
          <button id="sellUnfavoriteLootButton" type="button">出售非收藏</button>
          <div class="rarity-sell-row">
            <button id="sellRarityLootButton" type="button">按品质出售</button>
            <div class="settlement-rarity-filter" id="settlementRarityFilter" aria-label="选择品质"></div>
          </div>
        </div>
        <button id="returnRoomButton" type="button">返回房间</button>
      </section>
    </main>

    <dialog id="propDialog" class="prop-dialog">
      <form method="dialog">
        <header>
          <h2>使用道具</h2>
          <button value="close" aria-label="关闭">×</button>
        </header>
        <div id="propChoices" class="prop-choices"></div>
      </form>
    </dialog>

    <section class="bid-panel" id="bidPanel" hidden>
      <div class="keypad">
        <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-action="back">⌫</button>
        <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><div class="ratio-buttons"><button data-action="ratio" id="ratioButton">x2.0</button><button data-action="divide-ratio" id="divideRatioButton">/2.0</button></div>
        <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-action="last">上轮出价</button>
        <button data-key="0">0</button><button data-key="00">00</button><button data-key="000">000</button><button data-action="clear">归零</button>
      </div>
      <div class="bid-display">
        <p id="ratioHint">注意：当前出价若高于第二名出价 2 倍则直接成交</p>
        <div class="bid-number" id="bidNumber">0</div>
        <div class="bid-cn" id="bidCn">0</div>
        <button id="confirmBidButton" type="button">确认出价</button>
        <button id="closeBidButton" type="button">关闭</button>
      </div>
    </section>

    <div id="topOverlay" class="top-overlay" hidden></div>
    <script type="module" src="/game/game.js"></script>
  </body>
</html>
